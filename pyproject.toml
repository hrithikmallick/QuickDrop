[project]
name = "quickdrop"
version = "0.1.0"
description = "Temporary private file sharing on Cloudflare"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115.0,<0.128.0",
]

[dependency-groups]
dev = [
    "workers-py",
    "workers-runtime-sdk",
    "pytest",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
